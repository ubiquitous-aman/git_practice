<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your student account on the College Placement Portal." />
  <title>Register — Placement Portal</title>

  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <main id="main-content" role="main" class="w-full max-w-md">

    <header class="text-center mb-8">
      <div class="flex items-center justify-center gap-3 mb-3">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <a href="index.html" class="text-2xl font-bold text-white tracking-tight hover:opacity-90 transition-opacity">
          Campus<span class="text-cyan-400">Placement</span>Portal
        </a>
      </div>
      <p class="text-slate-400 text-sm">Join campus placements and apply to top companies</p>
    </header>

    <section class="glass-panel p-8 animate-fade-in" aria-labelledby="register-heading">
      <h2 id="register-heading" class="text-xl font-semibold text-white mb-6">Create Student Account</h2>

      <div id="register-error" role="alert" aria-live="polite" class="hidden alert alert-error mb-5">
        <span id="register-error-text"></span>
      </div>

      <form id="register-form" novalidate aria-label="Student registration form">

        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="text"
              id="name"
              name="name"
              class="form-input"
              placeholder="Rahul Sharma"
              autocomplete="name"
              required
              minlength="2"
              aria-required="true"
              aria-describedby="name-error"
            />
          </div>
          <span id="name-error" class="field-error hidden" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">College Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="reg-email"
              name="email"
              class="form-input"
              placeholder="rahul@college.edu"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="reg-email-error"
            />
          </div>
          <span id="reg-email-error" class="field-error hidden" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="reg-password"
              name="password"
              class="form-input"
              placeholder="Minimum 6 characters"
              autocomplete="new-password"
              required
              minlength="6"
              aria-required="true"
              aria-describedby="reg-password-error"
            />
          </div>
          <span id="reg-password-error" class="field-error hidden" role="alert"></span>
          <!-- Password strength indicator -->
          <div id="password-strength" class="mt-2 hidden">
            <div class="flex gap-1">
              <div class="strength-bar" id="strength-1"></div>
              <div class="strength-bar" id="strength-2"></div>
              <div class="strength-bar" id="strength-3"></div>
            </div>
            <p id="strength-label" class="text-xs text-slate-500 mt-1"></p>
          </div>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary w-full mt-2">
          <span id="register-btn-text">Create Account</span>
          <span id="register-spinner" class="spinner hidden" aria-hidden="true"></span>
        </button>
      </form>

      <p class="text-center mt-5 text-sm text-slate-400">
        Already have an account?
        <a href="index.html" class="text-indigo-400 font-semibold hover:text-indigo-300 transition-colors">
          Sign in
        </a>
      </p>
    </section>

  </main>

  <div id="toast-container" aria-live="polite" aria-atomic="true" class="toast-container"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    $(document).ready(function () {
      Portal.Auth.initRegisterPage();
    });
  </script>
</body>
</html>
