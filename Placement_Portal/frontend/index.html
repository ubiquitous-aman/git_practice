<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="College Placement Management Portal — Login to access your placement dashboard." />
  <title>Login — Placement Portal</title>

  <!-- External CSS: Design System -->
  <link rel="stylesheet" href="css/styles.css" />

  <!-- Tailwind CSS via CDN (Phase 1 approach — no build step) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4f46e5',
            'primary-dark': '#4338ca',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- jQuery via CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Skip to main content (accessibility) -->
  <a class="sr-only focus:not-sr-only" href="#login-form">Skip to login form</a>

  <main id="main-content" role="main" class="w-full max-w-md">

    <!-- Site Header / Branding -->
    <header class="text-center mb-8">
      <div class="flex items-center justify-center gap-3 mb-3">
        <!-- SVG Logo icon -->
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">
          Campus<span class="text-cyan-400">Placement</span>Portal
        </h1>
      </div>
      <p class="text-slate-400 text-sm">Sign in to access your placement dashboard</p>
    </header>

    <!-- Login Card -->
    <section class="glass-panel p-8 animate-fade-in" aria-labelledby="login-heading">
      <h2 id="login-heading" class="text-xl font-semibold text-white mb-6">Welcome Back</h2>

      <!-- Alert: Error Messages -->
      <div id="login-error" role="alert" aria-live="polite" class="hidden alert alert-error mb-5">
        <span id="login-error-text"></span>
      </div>

      <!-- Login Form -->
      <form id="login-form" novalidate aria-label="Login form">

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              placeholder="you@college.edu"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="email-error"
            />
          </div>
          <span id="email-error" class="field-error hidden" role="alert"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              aria-required="true"
              aria-describedby="password-error"
            />
          </div>
          <span id="password-error" class="field-error hidden" role="alert"></span>
        </div>

        <button
          type="submit"
          id="login-btn"
          class="btn btn-primary w-full mt-2"
          aria-describedby="login-status"
        >
          <span id="login-btn-text">Sign In</span>
          <span id="login-spinner" class="spinner hidden" aria-hidden="true"></span>
        </button>
        <span id="login-status" class="sr-only" aria-live="polite"></span>
      </form>

      <!-- Demo Quick-Fill (Development Aid) -->
      <div class="mt-6 pt-5 border-t border-white/10">
        <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-3">Demo Accounts</p>
        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            class="btn btn-secondary text-xs py-2"
            onclick="Portal.Auth.quickFill('tpo@college.edu', 'AdminPass123!')"
            aria-label="Fill TPO demo credentials"
          >
            TPO Officer
          </button>
          <button
            type="button"
            class="btn btn-secondary text-xs py-2"
            onclick="Portal.Auth.quickFill('admin@college.edu', 'AdminPass123!')"
            aria-label="Fill Admin demo credentials"
          >
            System Admin
          </button>
        </div>
      </div>

      <p class="text-center mt-5 text-sm text-slate-400">
        New student?
        <a href="register.html" class="text-indigo-400 font-semibold hover:text-indigo-300 transition-colors">
          Create account
        </a>
      </p>
    </section>

  </main>

  <!-- Toast notification container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true" class="toast-container"></div>

  <!-- JS Modules (ES6) -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // Page-specific initialisation
    $(document).ready(function () {
      Portal.Auth.initLoginPage();
    });
  </script>
</body>
</html>
